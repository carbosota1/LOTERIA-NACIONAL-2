name: LN Alert System

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode: picks | check | sync"
        required: true
        default: "picks"
      slot:
        description: "Slot: 13:15 | 15:15 | 16:15 | 22:15 | manual"
        required: true
        default: "manual"
      date:
        description: "Fecha opcional YYYY-MM-DD (vacío = hoy RD)"
        required: false
        default: ""

jobs:
  run:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run Alert System
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python src/alert_runner.py \
            --mode "${{ inputs.mode }}" \
            --slot "${{ inputs.slot }}" \
            --date "${{ inputs.date }}"

      - name: Commit alert logs
        run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@noreply.github.com"
          mkdir -p data
          git add -f data/alert_picks_log.csv || true
          git add -f data/alert_performance_log.csv || true
          git commit -m "Alert update (picks/perf logs)" || echo "No changes"
          git push --force